<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e3a43" />
  <meta name="description" content="FixSight: photograph a visible home repair problem and get a cautious, evidence-based first look." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FixSight" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>FixSight</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/scan" aria-label="FixSight home">
      <span class="brand-mark" aria-hidden="true">◉</span> Fix<span class="brand-accent">Sight</span>
    </a>
    <button type="button" id="connection" class="conn" data-state="checking" aria-live="polite">Checking…</button>
  </header>

  <div id="banner-demo" class="banner banner-demo" hidden>
    Demo mode: results are samples, not an analysis of your photos.
  </div>
  <div id="banner-update" class="banner banner-info" hidden>
    A new version of FixSight is ready. <button type="button" id="reload-app" class="link-btn">Reload</button>
  </div>

  <div class="shell">
    <nav class="nav" aria-label="Main">
      <a href="#/scan" data-nav="scan"><span class="nav-icon" aria-hidden="true">📷</span><span>Inspect</span></a>
      <a href="#/inspections" data-nav="inspections"><span class="nav-icon" aria-hidden="true">🗂️</span><span>History</span></a>
      <a href="#/jobs" data-nav="jobs"><span class="nav-icon" aria-hidden="true">🧰</span><span>Jobs</span></a>
      <a href="#/settings" data-nav="settings"><span class="nav-icon" aria-hidden="true">⚙️</span><span>Settings</span></a>
    </nav>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="loading" class="loading-overlay" hidden role="status" aria-live="assertive">
    <div class="loading-card">
      <div class="scanner"><div class="scan-line"></div><img id="loading-thumb" alt="" /></div>
      <p id="loading-text" class="loading-text">Analyzing your photos…</p>
      <p class="muted small">Usually 20–60 seconds. Keep this screen open.</p>
      <button type="button" id="loading-cancel" class="btn btn-secondary btn-small">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">FixSight needs JavaScript enabled.</p></noscript>
  <script type="module" src="/js/main.js"></script>
  <!-- Vercel Web Analytics. Same-origin, so the CSP covers it; no-ops elsewhere. -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
